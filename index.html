<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=docs/">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STAR REPLICA: AUTOMA</title>
    <script>
        window.location.replace("docs/" + window.location.search + window.location.hash);
    </script>
    <style>
        body {
            background-color: #030712;
            color: #00e5ff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 24px;
            max-width: 480px;
        }
        h1 {
            font-size: 24px;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn-launch {
            display: inline-block;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            font-weight: bold;
            font-size: 16px;
            padding: 14px 28px;
            border-radius: 8px;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(2, 132, 199, 0.4);
            border: 1px solid #38bdf8;
            transition: all 0.2s ease;
        }
        .btn-launch:hover {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            box-shadow: 0 0 30px rgba(14, 165, 233, 0.8);
            transform: scale(1.04);
        }
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(0, 229, 255, 0.2);
            border-top-color: #00e5ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>STAR REPLICA: AUTOMA</h1>
        <p>Initializing Von Neumann Autonomous System...</p>
        <a class="btn-launch" href="docs/">▶ PLAY GAME NOW</a>
    </div>
</body>
